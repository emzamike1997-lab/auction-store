<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: bright stage hero lit by three spotlights, closing-soon rail, FUT-style tiered cards in a grid, bottom tabs on phones, item sheet slides up.

:root {

  --surface-2: #E2EEFA;
  --ink: #0F2547;
  --ink-2: #4A6285;

  --win: #066F5B;
  --win-bg: #D6F3EA;
  --warn: #8A5200;
  --warn-bg: #FFEBC4;
  --lose: #C42848;
  --lose-bg: #FFE0E6;
  --scrim: rgba(12, 30, 66, .5);
  --shadow: 0 1px 2px rgba(30, 80, 160, .06), 0 10px 28px rgba(40, 95, 190, .13);
  --demo-bg: #DCEAFB;
  --demo-ink: #0F2547;
  --panel-core: #FFFFFF;
  --panel-edge: #D5E6F8;
  --panel-mix-a: 8%;
  --panel-mix-b: 26%;
  --deco: radial-gradient(60% 40% at 0% 0%, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0) 70%), repeating-conic-gradient(from 90deg at -4% -6%, rgba(112, 184, 238, .17) 0deg 5deg, rgba(255, 255, 255, 0) 5deg 11deg);
  --hero-bg: radial-gradient(95% 52% at 50% 112%, #FFFFFF 0 34%, rgba(255, 255, 255, 0) 74%), linear-gradient(176deg, #8DB2EE 0%, #B2CEF4 55%, #DDEAFB 100%);
  --hero-ink: #0F2547;
  --hero-ring: rgba(255, 255, 255, 0);
  --hero-curves: radial-gradient(circle at 100% 0%, transparent 0 170px, rgba(60, 196, 208, .34) 170px 186px, transparent 186px),
    radial-gradient(circle at 100% 0%, transparent 0 226px, rgba(255, 255, 255, .6) 226px 236px, transparent 236px),
    radial-gradient(circle at 100% 0%, transparent 0 282px, rgba(43, 95, 217, .26) 282px 302px, transparent 302px);
  --lamp-display: block;
  --fan-mobile: block;
  --dial-bg: #1F4FC2;
  --dial-ink: #FFFFFF;
  --dial-label: #CFE0FF;
  --hero-btn-bg: #2B5FD9;
  --hero-btn-ink: #FFFFFF;
  --mini-base: #FFFFFF;
  --mini-mix: 20%;
  --mini-shadow: rgba(20, 60, 140, .26);
  --win-grad: radial-gradient(circle at 50% 28%, #8BE6DA 0, #3F78E6 46%, #15328F 100%);
  --win-btn-ink: #12306F;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (min-width: 760px) {
  :root { --hero-bg: radial-gradient(62% 85% at 80% 108%, #FFFFFF 0 30%, rgba(255, 255, 255, 0) 74%), linear-gradient(118deg, #8DB2EE 0%, #B3CFF4 48%, #DDEAFB 100%); }
}
@media (max-width: 559px) {
  :root { --hero-curves: radial-gradient(circle at 106% 100%, transparent 0 96px, rgba(60, 196, 208, .36) 96px 110px, transparent 110px),
    radial-gradient(circle at 106% 100%, transparent 0 138px, rgba(255, 255, 255, .62) 138px 146px, transparent 146px),
    radial-gradient(circle at 106% 100%, transparent 0 176px, rgba(43, 95, 217, .26) 176px 194px, transparent 194px); }
}
:root[data-skin="classic"] {
  --bg: #EDF0F6; --surface: #FFFFFF; --surface-2: #E3E8F1; --ink: #0F1729; --ink-2: #4B566D; --line: #D3DAE7;
  --accent: #D93F0B; --on-accent: #FFFFFF; --pop: var(--accent); --on-pop: var(--on-accent); --sun: #FFB81F;
  --win: #0B8F63; --win-bg: #DDF5EA; --warn: #9A5600; --warn-bg: #FFEBC8; --lose: #C7263F; --lose-bg: #FDE1E6;
  --scrim: rgba(8, 13, 30, .55);
  --shadow: 0 1px 2px rgba(15, 23, 41, .06), 0 8px 24px rgba(15, 23, 41, .07);
  --demo-bg: var(--ink); --demo-ink: var(--bg);
  --panel-core: var(--surface-2); --panel-edge: var(--surface-2); --panel-mix-a: 14%; --panel-mix-b: 32%;
  --deco: none;
  --hero-bg: linear-gradient(115deg, #FF5A1F 0%, #FF8A2A 52%, #FFC247 100%);
  --hero-ink: #1A0B02; --hero-ring: rgba(255, 255, 255, .22); --hero-curves: none; --lamp-display: none; --fan-mobile: none;
  --dial-bg: #1A0B02; --dial-ink: var(--sun); --dial-label: #FFDFA0; --hero-btn-bg: #1A0B02; --hero-btn-ink: #FFFFFF;
  --mini-base: #FFF4E6; --mini-mix: 30%; --mini-shadow: rgba(26, 11, 2, .28);
  --win-grad: radial-gradient(circle at 50% 30%, #FF8A2A 0, #D93F0B 45%, #1A0B02 100%); --win-btn-ink: #1A0B02;
  color-scheme: light;
}
:root[data-skin="midnight"] {
  --bg: #080D1C; --surface: #111933; --surface-2: #1A2447; --ink: #EEF2FB; --ink-2: #A3AECA; --line: #27325A;
  --accent: #FF6A3A; --on-accent: #1B0800; --pop: var(--accent); --on-pop: var(--on-accent); --sun: #FFB81F;
  --win: #35D6A0; --win-bg: #0F3A2E; --warn: #FFB938; --warn-bg: #3D2A07; --lose: #FF6B84; --lose-bg: #43121F;
  --scrim: rgba(2, 5, 14, .7);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
  --demo-bg: var(--ink); --demo-ink: var(--bg);
  --panel-core: var(--surface-2); --panel-edge: var(--surface-2); --panel-mix-a: 14%; --panel-mix-b: 32%;
  --deco: none;
  --hero-bg: linear-gradient(115deg, #FF5A1F 0%, #FF8A2A 52%, #FFC247 100%);
  --hero-ink: #1A0B02; --hero-ring: rgba(255, 255, 255, .22); --hero-curves: none; --lamp-display: none; --fan-mobile: none;
  --dial-bg: #1A0B02; --dial-ink: var(--sun); --dial-label: #FFDFA0; --hero-btn-bg: #1A0B02; --hero-btn-ink: #FFFFFF;
  --mini-base: #FFF4E6; --mini-mix: 30%; --mini-shadow: rgba(26, 11, 2, .28);
  --win-grad: radial-gradient(circle at 50% 30%, #FF8A2A 0, #D93F0B 45%, #1A0B02 100%); --win-btn-ink: #1A0B02;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { position: relative; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--deco); -webkit-mask-image: radial-gradient(120% 90% at 0 0, #000 0, transparent 78%); mask-image: radial-gradient(120% 90% at 0 0, #000 0, transparent 78%); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1180px; margin-inline: auto; padding-inline: 16px; }

/* demo strip */
.demo { background: var(--demo-bg); color: var(--demo-ink); font-size: 12.5px; padding: 7px 16px; text-align: center; }
.demo b { background: var(--sun); color: #1A0B02; border-radius: 999px; padding: 1px 8px; margin-right: 6px; font-weight: 700; }
.demo .link { background: none; border: 0; color: inherit; text-decoration: underline; padding: 0; margin-left: 6px; }

/* header + tabs */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand-mark { display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 0; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.brand-mark svg { color: var(--accent); }
.actions { display: flex; align-items: center; gap: 8px; min-width: 0; }
.limit { display: grid; gap: 4px; min-width: 128px; }
.limit em { font-style: normal; }
.limit span { font-size: 11px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }
.limit b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }
.meter { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tab { display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 6px 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); border-radius: 12px; position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.count { font-style: normal; font-family: var(--f-mono); font-size: 11px; background: var(--accent); color: var(--on-accent); border-radius: 99px; padding: 0 6px; min-width: 18px; text-align: center; line-height: 17px; margin-left: 4px; }
.count:empty { display: none; }
.tab .count { position: absolute; top: 2px; left: calc(50% + 8px); margin: 0; }
.brand-mark, .tab { white-space: nowrap; }
.brand-mark, .tabs, .actions { flex: none; }
@media (min-width: 760px) and (max-width: 979px) { .limit { min-width: 100px; } .limit em { display: none; } .tab { padding: 8px 10px; } .bar { gap: 8px; } }
@media (max-width: 419px) { .limit { min-width: 112px; } .actions { gap: 6px; } }
@media (max-width: 349px) { .limit { display: none; } .actions { margin-left: auto; } }
@media (max-width: 399px) { .limit { min-width: 92px; } .limit em { display: none; } .brand-mark { font-size: 18px; gap: 7px; } .brand-mark svg { width: 22px; height: 22px; } }
@media (min-width: 760px) {
  .tabs { position: static; display: flex; gap: 4px; border: 0; padding: 0; background: none; }
  .tab { display: flex; align-items: center; gap: 7px; font-size: 14px; padding: 8px 14px; }
  .tab svg { width: 18px; height: 18px; }
  .tab[aria-current="page"] { background: var(--surface-2); color: var(--ink); }
  .tab .count { position: static; }
  main.wrap { padding-bottom: 48px; }
}
main.wrap { padding-block: 18px 96px; display: grid; gap: 26px; grid-template-columns: minmax(0, 1fr); }
main.wrap > section { min-width: 0; }
@media (min-width: 760px) { main.wrap { padding-bottom: 48px; } }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 22px; color: var(--hero-ink); background: var(--hero-bg); display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); box-shadow: var(--shadow); }
.hero::before { content: ""; position: absolute; right: -90px; top: -90px; width: 420px; height: 420px; border-radius: 50%; background: repeating-radial-gradient(circle, transparent 0 22px, var(--hero-ring) 22px 24px); pointer-events: none; }
.hero::after { content: ""; position: absolute; inset: 0; background: var(--hero-curves); pointer-events: none; }
.hero > * { position: relative; }
.eyebrow { font: 700 12px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; }
.hero h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 6vw, 48px); line-height: 1; letter-spacing: -.03em; text-wrap: balance; margin-top: 10px; }
.hero p.sub { margin-top: 10px; max-width: 46ch; font-size: 15.5px; }
.dial { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.dial div { background: var(--dial-bg); color: var(--dial-ink); border-radius: 14px; padding: 9px 12px 8px; min-width: 62px; text-align: center; }
.dial b { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 28px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.dial small { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dial-label); }
.hero-stats { display: flex; gap: 8px 18px; flex-wrap: wrap; margin-top: 14px; font-size: 13.5px; font-weight: 600; }
.btn { border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-dark { background: var(--hero-btn-bg); color: var(--hero-btn-ink); margin-top: 16px; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn-win { background: var(--win); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.fan { position: relative; height: 210px; max-width: 360px; width: 100%; margin-inline: auto; }
.fan .mini { position: absolute; z-index: 1; bottom: 0; width: 44%; aspect-ratio: 4/5; border-radius: 16px; background: color-mix(in srgb, var(--tint) var(--mini-mix), var(--mini-base)); box-shadow: 0 10px 26px var(--mini-shadow); display: grid; place-items: center; padding: 8px; }
.fan .lamps { position: absolute; z-index: 0; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; display: var(--lamp-display); }
.fan .mini:nth-of-type(1) { left: 0; transform: rotate(-9deg); }
.fan .mini:nth-of-type(2) { left: 28%; z-index: 2; transform: translateY(-14px); }
.fan .mini:nth-of-type(3) { right: 0; transform: rotate(9deg); }
.fan .mini svg { width: 100%; height: auto; }
@media (max-width: 559px) {
  .hero { padding: 18px; gap: 0; border-radius: 22px; }
  .hero h1 { font-size: 27px; margin-top: 8px; }
  .hero p.sub { font-size: 14px; margin-top: 8px; }
  .dial { margin-top: 14px; gap: 6px; flex-wrap: nowrap; }
  .dial div { flex: 1; min-width: 0; padding: 7px 4px 6px; }
  .dial b { font-size: 24px; }
  .hero-stats { margin-top: 10px; font-size: 13px; }
  .btn-dark { margin-top: 12px; padding: 10px 16px; }
  .fan { display: var(--fan-mobile); height: 158px; margin-top: 12px; }
  .fan .mini { width: 31%; padding: 6px; border-radius: 13px; }
  .fan .mini:nth-of-type(2) { left: 34.5%; transform: translateY(-8px); }
  main.wrap { padding-top: 14px; }
}
@media (min-width: 560px) and (max-width: 759px) { .fan { height: 190px; } }
@media (min-width: 760px) { .hero { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); align-items: center; padding: 30px; } .fan { height: 260px; } }

/* section heads + controls */
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec h2 { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; display: flex; align-items: center; gap: 9px; }
.sec small { color: var(--ink-2); font-size: 13px; }
.live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lose); box-shadow: 0 0 0 0 var(--lose); animation: ping 1.6s infinite; }
@keyframes ping { 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.rail-row { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 8px; margin-inline: -16px; padding-inline: 16px; }
.rail-row .card { flex: none; width: 206px; scroll-snap-align: start; }
.controls { display: grid; gap: 10px; margin-bottom: 14px; }
.search { position: relative; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-2); }
.search input { width: 100%; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px 0 40px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-inline: -16px; padding-inline: 16px; }
.pill { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 13.5px; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill.drop[aria-pressed="true"] { background: var(--pop); color: var(--on-pop); border-color: var(--pop); }
.selects { display: flex; gap: 10px; flex-wrap: wrap; }
.selects label { display: grid; gap: 3px; font-size: 11.5px; color: var(--ink-2); flex: 1 1 140px; min-width: 0; }
.selects select { height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; width: 100%; }

/* grid + card */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
.card { position: relative; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); display: grid; grid-template-rows: auto 1fr; overflow: hidden; border: 1px solid var(--line); transition: transform .15s, box-shadow .15s; }
.card:hover { transform: translateY(-3px); }
.panel { position: relative; aspect-ratio: 1/1; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--tint) var(--panel-mix-a), var(--panel-core)) 0 38%, color-mix(in srgb, var(--tint) var(--panel-mix-b), var(--panel-edge)) 100%); display: grid; place-items: center; padding: 14px 12px 22px; }
.panel .art { width: 100%; height: 100%; }
.tier { position: absolute; left: 10px; top: 10px; display: grid; justify-items: center; padding: 6px 8px 7px; min-width: 42px; border-radius: 10px 10px 18px 18px; font-family: var(--f-display); line-height: 1; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 3px 8px rgba(0, 0, 0, .22); }
.tier b { font-size: 20px; font-weight: 800; }
.tier i { font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .12em; margin-top: 3px; }
.tier-ds { background: linear-gradient(150deg, #FBE9A0, #E0A91F); color: #3B2A00; }
.tier-ex { background: linear-gradient(150deg, #C6F3EE, #4FBDB1); color: #042E2B; }
.tier-gd { background: linear-gradient(150deg, #F7C9A1, #C27A3F); color: #3A1B05; }
.tier-wn { background: linear-gradient(150deg, #CBD3E2, #8592AB); color: #101830; }
.watch { position: absolute; right: 10px; top: 10px; z-index: 3; width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); }
.watch svg { fill: none; stroke: currentColor; }
.watch[aria-pressed="true"] { color: var(--accent); }
.watch[aria-pressed="true"] svg { fill: currentColor; }
.timer { position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 9px; font: 500 12.5px/1.2 var(--f-mono); background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.timer.t-warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.timer.t-hot { background: var(--lose-bg); color: var(--lose); border-color: transparent; }
.timer.t-final { background: var(--lose); color: #fff; border-color: transparent; animation: pulse 1s infinite; }
.timer .ot { background: currentColor; border-radius: 4px; padding: 0 4px; font-size: 10px; }
.timer .ot span { color: var(--surface); }
.timer.t-final .ot span { color: var(--lose); }
.timer.t-final .ot { background: #fff; }
.timer.t-done { background: var(--surface-2); }
@keyframes pulse { 50% { transform: scale(1.06); box-shadow: 0 0 0 5px color-mix(in srgb, var(--lose) 25%, transparent); } }
.tag-drop { position: absolute; right: 10px; bottom: 10px; background: var(--pop); color: var(--on-pop); font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: 4px 9px; }
.meta { padding: 12px 13px 14px; display: grid; gap: 3px; align-content: start; }
.brand { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.meta h3 { font-size: 15px; line-height: 1.25; font-weight: 600; }
.open { background: none; border: 0; padding: 0; text-align: left; font-family: var(--f-display); font-weight: 600; font-size: 15.5px; line-height: 1.22; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.open::after { content: ""; position: absolute; inset: 0; z-index: 1; }
.meta .sub { font-size: 12.5px; color: var(--ink-2); }
.price-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; margin-top: 8px; }
.lbl { display: block; font-size: 11px; color: var(--ink-2); }
.amt { font-family: var(--f-display); font-weight: 800; font-size: 21px; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }

    var old = $('#win'); if (old) old.remove();
    var el = document.createElement('div'); el.id = 'win'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'You won');
    el.innerHTML = '<canvas aria-hidden="true"></canvas><div class="win-card" style="--tint:' + l.col + '"><p class="eyebrow">Auction closed</p><h1>You won it</h1><div class="win-art">' + art(l) + '</div><p style="font-size:18px;font-weight:700">' + esc(l.t) + '</p><p style="font-size:26px;font-family:var(--f-display);font-weight:800">' + ZAR(l.current) + '</p><p style="opacity:.9;max-width:34ch">Pay within 30 minutes to lock it in. The seller ships once payment clears.</p><div class="btn-row"><button class="btn btn-light" type="button" data-act="winpay" data-id="' + l.id + '">Pay with demo card</button><button class="btn btn-outline" type="button" data-act="winclose">View my wins</button></div></div>';
    document.body.appendChild(el);
    $('button', el).focus();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) confetti($('canvas', el));
  }
  function confetti(cv) {
    var ctx = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight, cols = SKINS.filter(function (k) { return k.id === currentSkin(); })[0].conf;
    var ps = []; for (var i = 0; i < 140; i++) ps.push({ x: rnd(0, W), y: rnd(-H * .5, 0), vx: rnd(-1.4, 1.4), vy: rnd(2, 5.5), r: rnd(4, 9), a: rnd(0, 6.28), va: rnd(-.2, .2), c: pick(cols) });
    var t0 = now(); cancelAnimationFrame(raf);
    (function loop() {
      ctx.clearRect(0, 0, W, H);
      ps.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
      if (now() - t0 < 3200 && $('#win')) raf = requestAnimationFrame(loop); else ctx.clearRect(0, 0, W, H);
    })();
  }
  function closeWin(toBids) {
    var w = $('#win'); if (w) w.remove();
    if (toBids) { S.tab = 'bids'; S.seg = 'won'; window.scrollTo(0, 0); }
    refresh();
  }

  /* ---------- events ---------- */
  function setBid(v) { var i = $('#bidAmt'); if (i) { i.value = v; if (S.open) S.draft[S.open] = v; } }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-open],[data-watch],[data-tab],[data-cat],[data-seg],[data-act],[data-amt],[data-step],[data-close],[data-close-modal],[data-pick-skin]');
    if (!t) { if (e.target.classList && e.target.classList.contains('scrim')) { if (e.target.classList.contains('top2')) closeModal(); else closeSheet(); } return; }
    var d = t.dataset;
    if (d.pickSkin) { applySkin(d.pickSkin); return; }
    if (d.watch) { toggleWatch(+d.watch); return; }
    if (d.open) { openSheet(+d.open); return; }
    if (d.tab) { S.tab = d.tab; window.scrollTo(0, 0); refresh(); return; }
    if (d.cat) { S.cat = (S.cat === d.cat && d.cat !== 'All') ? 'All' : d.cat; S.tab = 'market'; refresh(); if (t.closest('.hero')) { var g = $('#cats'); if (g) g.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
    if (d.seg) { S.seg = d.seg; refresh(); return; }
    if (d.close !== undefined) { closeSheet(); return; }
    if (d.closeModal !== undefined) { closeModal(); return; }
    if (d.amt) { setBid(+d.amt); return; }
    if (d.step) { var l0 = byId(S.open), cur = +($('#bidAmt').value) || minBid(l0), st = inc(minBid(l0)); setBid(Math.max(minBid(l0), cur + (+d.step) * st)); return; }
    var a = d.act, l = S.open ? byId(S.open) : null;
    if (a === 'rules') openRules();
    else if (a === 'themes') openThemes();
    else if (a === 'bid' && l) attemptBid(l, parseInt(($('#bidAmt').value || '').replace(/\D/g, ''), 10) || 0);
    else if (a === 'buy' && l) attemptBuy(l);
    else if (a === 'verify') { S.verified = true; closeModal(); var c = S.pending; S.pending = null; if (c) c(); }
    else if (a === 'pay' && l) { l.paid = true; toast('Paid with the demo card. The seller has been told to ship.', 'win'); refresh(); }
    else if (a === 'winpay') { var wl = byId(+d.id); wl.paid = true; closeWin(true); toast('Paid with the demo card. The seller has been told to ship.', 'win'); }
    else if (a === 'winclose') closeWin(true);
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'bidAmt') { var v = parseInt(e.target.value.replace(/\D/g, ''), 10); if (S.open && v) S.draft[S.open] = v; }
    if (e.target.id === 'q') { S.q = e.target.value; renderGrid(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'fit') { S.fit = e.target.value; renderGrid(); }
    if (e.target.id === 'cond') { S.cond = e.target.value; renderGrid(); }
    if (e.target.id === 'sort') { S.sort = e.target.value; renderGrid(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if ($('#win')) closeWin(false); else if ($('.scrim.top2', layer)) closeModal(); else if (S.open) closeSheet(); }
    if (e.key === 'Enter' && e.target.id === 'bidAmt') { var l = byId(S.open); attemptBid(l, parseInt(e.target.value.replace(/\D/g, ''), 10) || 0); }
  });

  /* ---------- clocks ---------- */
  function fmtLong(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return { d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 };
  }
  function uiTick() {
    $$('[data-t]').forEach(function (el) {
      var l = byId(el.dataset.t); if (!l) return;
      var ms = remaining(l), ts = l.state === 'lastchance' ? (ms < 3600000 ? 'warn' : 'calm') : tstate(ms);
      var b = el.dataset.plain ? el : $('b', el);
      if (b) b.textContent = ms > 0 ? fmt(ms) : (l.state === 'live' ? '00:00' : 'Ended');
      el.className = (el.dataset.plain ? 'big' : 'timer') + ' t-' + ts;
    });
    var p = fmtLong(DROP - now()), map = { d: p.d, h: p.h, m: p.m, s: p.s };
    $$('[data-drop]').forEach(function (el) { el.textContent = String(map[el.dataset.drop]).padStart(2, '0'); });
  }

  /* ---------- boot ---------- */
  function buildStatic() {
    $('#cats').innerHTML = CATS.map(function (c) { return '<button class="pill' + (c === 'Drop night' ? ' drop' : '') + '" type="button" data-cat="' + c + '" aria-pressed="' + (c === S.cat) + '">' + c + '</button>'; }).join('');
    renderHero();
  }
  buildStatic(); refresh(); uiTick();
  setInterval(uiTick, 250);
  setInterval(simTick, 1000);
  window.DW = { lots: lots, S: S, attemptBid: attemptBid, attemptBuy: attemptBuy, simTick: simTick, minBid: minBid, inc: inc, committed: committed, ustatus: ustatus, closeLot: closeLot, byId: byId, openSheet: openSheet, refresh: refresh, applySkin: applySkin, currentSkin: currentSkin };
})();
</script>
